[pytest]
# `app` lives at ./app, and nothing installs it as a package — so it is importable only
# when the backend directory is on sys.path. `python -m pytest` puts it there implicitly
# (that form prepends the working directory); a bare `pytest` does not. Both the Docker
# image's CMD and .github/workflows/ci.yml invoke bare `pytest`, so without this the
# suite fails at conftest import with ModuleNotFoundError: No module named 'app', and
# only the `python -m` form appears to work.
#
# Setting it here rather than adding tests/__init__.py or a conftest sys.path hack means
# one declaration covers every invocation: container, CI, IDE, and shell.
pythonpath = .

testpaths = tests
