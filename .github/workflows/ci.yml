name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fdt
          POSTGRES_PASSWORD: fdt
          POSTGRES_DB: fdt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fdt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-secret
      TEST_DATABASE_URL: postgresql+psycopg://fdt:fdt@localhost:5432/fdt_test
      REDIS_URL: redis://localhost:6379/1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: No-float check on app/domain
        run: |
          if grep -rn "float(" app/domain; then
            echo "float() found in app/domain — see the financial-domain-engine skill"
            exit 1
          fi
      - run: ruff check app tests
      - run: mypy app --ignore-missing-imports
      - run: pytest --cov=app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
