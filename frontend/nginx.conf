# Production web server for the built SPA. Baked into the `prod` image (see Dockerfile).
# Development routing lives in infrastructure/nginx/nginx.conf and vite.config.ts instead.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Bank statement CSV/PDF uploads go through here; Nginx's 1 MB default rejects
    # a year of statements with a 413 before Flask ever sees the request.
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Every other path is a client-side route: serve the shell, never cache it, so a deploy
    # is picked up on the next page load.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri /index.html;
    }
}
